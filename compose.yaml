# Pile complète ENSO Monitor : docker compose up -d --build
# Seul Caddy (service web) est exposé ; la base et l'API restent sur les réseaux internes.
name: enso-monitor

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?définir POSTGRES_USER dans .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: ${POSTGRES_DB:?définir POSTGRES_DB dans .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]
    restart: unless-stopped

  api:
    build: ./backend
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks: [backend, frontend]
    restart: unless-stopped

  # Tâche ponctuelle : importe l'instantané NOAA versionné puis s'arrête.
  # Mise à jour depuis la NOAA : docker compose run --rm etl python -m etl.import_oni --download
  etl:
    build: ./backend
    command: ["python", "-m", "etl.import_oni"]
    environment:
      <<: *backend-env
      ONI_DATA_DIR: /data/raw
    volumes:
      - ./data:/data
    depends_on:
      api:
        condition: service_healthy
    networks: [backend]
    restart: "no"

  web:
    build: ./frontend
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks: [frontend]
    restart: unless-stopped

networks:
  frontend:
  backend:

volumes:
  pgdata:
  caddy_data:
  caddy_config:
