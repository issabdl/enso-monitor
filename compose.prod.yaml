# Surcharge pour un VPS : docker compose -f compose.yaml -f compose.prod.yaml up -d --build
# Avec SITE_ADDRESS=enso.example.org dans .env, Caddy obtient automatiquement un certificat HTTPS.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  web:
    ports: !override
      - "80:80"
      - "443:443"
      - "443:443/udp"
    logging: *logging
  api:
    logging: *logging
  db:
    logging: *logging
  etl:
    logging: *logging
